stages:
  prepare:
    cmd: python src/data_prep.py
    deps:
      - src/data_prep.py
      - data/raw/telco_churn.csv
    params:
      - prepare
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - models/preprocessor.pkl

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - train_rf
      - train_logistic
    outs:
      - models/model_rf.pkl
      - models/model_logistic.pkl
    metrics:
      - metrics.json:
          cache: false
